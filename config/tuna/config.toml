schemaVersion = 1

[catalogs]
sortOrders = []

    [[catalogs.globalScopes]]
    catalogIdentifier = 'Tuna.EffectsCatalog'
    mode = 'none'
    selectedItemKeys = []

    [[catalogs.globalScopes]]
    catalogIdentifier = 'TunaEmoji.EmojiCatalog'
    mode = 'none'
    selectedItemKeys = []

    [[catalogs.globalScopes]]
    catalogIdentifier = 'TunaSystem.MenuItemsCatalog'
    mode = 'all'
    selectedItemKeys = [ 'Menu Items' ]

[[comboMode.bindings]]
iconPath = 'note.text'
key = 'n'
label = 'Note'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/Obsidian.app'
    key = 'o'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Obsidian/TunaCore.CommonActionsCatalog.Open'

[[comboMode.bindings]]
iconPath = 'text.and.command.macwindow'
key = 'b'
label = 'Browser'

    [[comboMode.bindings.children]]
    iconPath = '/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app'
    key = 's'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Safari/TunaCore.CommonActionsCatalog.Open'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/Google Chrome.app'
    key = 'c'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Google%20Chrome/TunaCore.CommonActionsCatalog.Open'

[[comboMode.bindings]]
iconPath = 'brain'
key = 'a'
label = 'AI'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/ChatGPT.app'
    key = 'g'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.ChatGPT/TunaCore.CommonActionsCatalog.Open'

[[comboMode.bindings]]
iconPath = 'apple.terminal'
key = 't'
label = 'Terminal'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/Ghostty.app'
    key = 'g'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Ghostty/TunaCore.CommonActionsCatalog.Open'

[[comboMode.bindings]]
iconPath = 'envelope'
key = 'c'
label = 'Communication'

    [[comboMode.bindings.children]]
    iconPath = '/System/Applications/Mail.app'
    key = 'm'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Mail/TunaCore.CommonActionsCatalog.Open'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/Discord.app'
    key = 'd'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Discord/TunaCore.CommonActionsCatalog.Open'

    [[comboMode.bindings.children]]
    iconPath = '/Applications/Slack.app'
    key = 's'
    url = 'tuna://run/TunaCore.ApplicationsCatalog.Slack/TunaCore.CommonActionsCatalog.Open'

[hotkeys.app.activate]
carbonKeyCode = 49
carbonModifiers = 2048

[hotkeys.app.comboMode]
carbonKeyCode = 49
carbonModifiers = 6656

[hotkeys.app.textMode]
carbonKeyCode = 49
carbonModifiers = 2560

[[hotkeys.custom]]
id = '04CE8E32-6123-4CB4-AFA8-4CD7D8B5832E'
presentation = 'auto'

    [hotkeys.custom.command]
    actionIdentifier = 'TunaCore.CommonActionsCatalog.Browse'
    subjectIdentifier = 'Tuna.Internal.ClipboardProxyCatalog.Clipboard History'

    [hotkeys.custom.shortcut]
    carbonKeyCode = 9
    carbonModifiers = 768

[settings]
backspaceBehavior = 'deleteCharacters'
comboModeBackspaceBehavior = 'stepBack'
comboModeCheatsheetBehavior = 'always'
comboModeCheatsheetShowDetails = false
comboModeDoublePressTrigger = 'leftCommand'
comboModeModifierTrigger = 'leftCommand'
comboModeTriggerType = 'doublePress'
themeIdentifier = 'com.brnbw.tuna.themes.default'

[[smartLinks.entries]]
enabled = false
name = 'Bing'
requiresInput = true
template = 'https://www.bing.com/search?q={{input}}'

[[smartLinks.entries]]
